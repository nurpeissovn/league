<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League Player Rankings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.12.16/dist/framer-motion.umd.js"></script>
  <style>
    body {
      background: linear-gradient(to bottom right, #e0e7ff, #c7d2fe);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    .table-container {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      object-fit: cover;
      margin-right: 10px;
    }
    .badge {
      width: 28px;
      height: 28px;
      margin-right: 6px;
    }
    .fade-in {
      animation: fadein 0.7s ease;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="p-10">
  <h1 class="text-5xl font-extrabold text-center mb-8 text-indigo-700 drop-shadow-lg">
    🏆 League Player Rankings
  </h1>

  <div id="rankingTable" class="overflow-x-auto table-container p-6 mx-auto max-w-6xl fade-in">
    <table class="min-w-full text-center border-separate border-spacing-y-2">
      <thead class="text-gray-700 text-lg">
        <tr id="tableHeader" class="bg-indigo-100 rounded-lg">
          <th class="py-3 px-4 rounded-l-xl cursor-pointer" onclick="sortTable()">Rank ⬍</th>
          <th class="py-3 px-4">Player</th>
          <!-- Dynamic date columns -->
          <th class="py-3 px-4 rounded-r-xl">Total Goals 🥇</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    let rankingData = [];

    async function loadRanking() {
      const res = await fetch("/ranking");
      const data = await res.json();
      rankingData = data;
      renderRanking();
    }

    function renderRanking() {
      const dates = new Set();
      rankingData.forEach(player => {
        player.daily_stats.forEach(d => dates.add(d.date));
      });
      const sortedDates = Array.from(dates).sort();

      // Header
      const headerRow = document.getElementById("tableHeader");
      headerRow.innerHTML = `
        <th class="py-3 px-4 rounded-l-xl cursor-pointer" onclick="sortTable()">Rank ⬍</th>
        <th class="py-3 px-4">Player</th>
        ${sortedDates.map(date => `<th class="py-3 px-4">${formatDate(date)}</th>`).join('')}
        <th class="py-3 px-4 rounded-r-xl">Total Goals 🥇</th>
      `;

      // Body
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = rankingData.map((player, i) => {
        const dailyMap = Object.fromEntries(player.daily_stats.map(d => [d.date, d.goals]));
        const avatarUrl = `https://api.dicebear.com/9.x/personas/svg?seed=${encodeURIComponent(player.name)}`;
        const teamLogo = `https://api.dicebear.com/9.x/shapes/svg?seed=${encodeURIComponent(player.name.slice(0, 3))}`;

        return `
          <tr class="bg-white hover:bg-indigo-50 transition rounded-xl shadow-sm fade-in">
            <td class="py-3 px-4 font-bold text-indigo-600">${i + 1}</td>
            <td class="py-3 px-4 flex items-center justify-center">
              <img src="${avatarUrl}" class="avatar" alt="">
              <img src="${teamLogo}" class="badge" alt="">
              <span class="font-semibold">${player.name}</span>
            </td>
            ${sortedDates.map(date => `<td class="py-3 px-4">${dailyMap[date] || 0}</td>`).join('')}
            <td class="py-3 px-4 font-bold text-indigo-700">${player.total_goals}</td>
          </tr>
        `;
      }).join('');
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function sortTable() {
      rankingData.reverse(); // toggles ASC/DESC by total_goals
      renderRanking();
    }

    loadRanking();
  </script>
</body>
</html>
