<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League Registration</title>
  <style>
    body { font-family: Arial; background: #f0f4ff; padding: 20px; }
    h1 { text-align: center; }
    .card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input, select { padding: 5px; margin: 5px; }
    button { padding: 6px 12px; margin-left: 5px; border-radius: 6px; border: none; background: #2563eb; color:white; cursor:pointer;}
    button:hover { background: #1e40af; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px;}
    th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
    th { background: #f9f9f9; }
    .player-row, .inline-edit { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .player-row { margin-bottom: 4px; }
    .inline-edit input { flex: 1 1 140px; min-width: 120px; }
    .inline-edit button, .player-row button { margin-left: 0; }
  </style>
</head>
<body>
  <h1>🏟️ League Registration</h1>

  <div class="card">
    <h2>Add Team</h2>
    <input type="text" id="teamName" placeholder="Team Name">
    <button onclick="addTeam()">Add Team</button>
  </div>

  <div class="card">
    <h2>Add Player</h2>
    <input type="text" id="playerName" placeholder="Player Name">
    <select id="playerTeam"></select>
    <button onclick="addPlayer()">Add Player</button>
  </div>

  <div class="card">
    <h2>Registered Teams & Players</h2>
    <table id="regTable">
      <thead><tr><th>Team</th><th>Players</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div style="text-align:center">
    <button onclick="goToTracker()">Go to Tracker</button>
  </div>

  <script>
    const teams = new Map();
    const editState = {
      teamId: null,
      player: null
    };

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function playerInputId(teamId, index) {
      return `player-edit-${teamId}-${index}`;
    }

    async function loadTeamsFromDB() {
      try {
        const [teamRes, playerRes] = await Promise.all([
          fetch("/api/list-teams"),
          fetch("/api/players")
        ]);

        if (!teamRes.ok) {
          console.error("Failed to load teams:", await teamRes.text());
          return;
        }

        const dbTeams = await teamRes.json();
        teams.clear();
        for (const t of dbTeams) {
          teams.set(t.id, { id: t.id, name: t.name, players: [] });
        }

        if (playerRes.ok) {
          const dbPlayers = await playerRes.json();
          for (const p of dbPlayers) {
            const team = teams.get(p.team_id);
            if (team) {
              team.players.push(p.name);
            }
          }
        } else {
          console.warn("Failed to load players:", await playerRes.text());
        }

        teams.forEach(team => team.players.sort((a, b) => a.localeCompare(b)));

        editState.teamId = null;
        editState.player = null;

        renderDropdowns();
        renderTable();
      } catch (e) {
        console.error("Failed to load teams:", e);
      }
    }

    async function addTeam() {
      const input = document.getElementById("teamName");
      const name = input.value.trim();
      if (!name) return alert("Enter team name!");

      const exists = Array.from(teams.values()).some(t => t.name.toLowerCase() === name.toLowerCase());
      if (exists) {
        alert("Team already exists!");
        return;
      }

      try {
        const res = await fetch("/api/add-team", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ name })
        });
        if (!res.ok) {
          const msg = await res.text();
          alert("Failed to add team: " + msg);
          return;
        }
        const data = await res.json();
        teams.set(data.id, { id: data.id, name: data.name, players: [] });
        input.value = "";
        renderDropdowns();
        renderTable();
      } catch (e) {
        console.error(e);
        alert("Network error while adding team");
      }
    }

    async function addPlayer() {
      const nameInput = document.getElementById("playerName");
      const select = document.getElementById("playerTeam");
      const name = nameInput.value.trim();
      const teamId = Number(select.value);
      if (!name) return alert("Enter player name!");
      if (!teamId) return alert("Select team!");

      const team = teams.get(teamId);
      if (!team) {
        alert("Selected team no longer exists. Refreshing list.");
        await loadTeamsFromDB();
        return;
      }
      
      if (team.players.includes(name)) {
        alert("Player already exists in this team!");
        return;
      }
      
      try {
        const res = await fetch("/api/add-player", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            name,
            team_id: teamId,
            goals: 0,
            assists: 0
          })
        });
        
        if (!res.ok) {
          const msg = await res.text();
          alert("Failed to add player: " + msg);
          return;
        }
        
        team.players.push(name);
        team.players.sort((a, b) => a.localeCompare(b));
        nameInput.value = "";
        renderTable();
      } catch (e) {
        console.error(e);
        alert("Network error while adding player");
      }
    }

    async function removePlayer(teamId, encodedName) {
      const team = teams.get(teamId);
      if (!team) return;

      const playerName = decodeURIComponent(encodedName);
      if (!confirm(`Remove ${playerName} from ${team.name}?`)) return;
      
      try {
        const res = await fetch("/api/delete-player", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            name: playerName,
            team_id: teamId
          })
        });
        
        if (!res.ok) {
          const msg = await res.text();
          alert("Failed to remove player: " + msg);
          return;
        }
        
        team.players = team.players.filter(p => p !== playerName);
        renderTable();
      } catch (e) {
        console.error(e);
        alert("Network error while removing player");
      }
    }

    function renderDropdowns() {
      const select = document.getElementById("playerTeam");
      if (!select) return;

      const previous = select.value;
      select.innerHTML = "";
      const sortedTeams = Array.from(teams.values()).sort((a, b) => a.name.localeCompare(b.name));
      for (const team of sortedTeams) {
        const option = document.createElement("option");
        option.value = String(team.id);
        option.textContent = team.name;
        select.appendChild(option);
      }

      if (previous && teams.has(Number(previous))) {
        select.value = previous;
      }
    }
  
    function renderTable() {
      const tbody = document.querySelector("#regTable tbody");
      if (!tbody) return;

      tbody.innerHTML = "";
      const sortedTeams = Array.from(teams.values()).sort((a, b) => a.name.localeCompare(b.name));
      for (const team of sortedTeams) {
        const teamNameEsc = escapeHtml(team.name);
        const isEditingTeam = editState.teamId === team.id;

        const teamCell = isEditingTeam
          ? `<div class="inline-edit">
              <input id="team-edit-${team.id}" value="${teamNameEsc}">
              <button onclick="saveTeamName(${team.id})">Save</button>
              <button onclick="cancelTeamEdit()">Cancel</button>
            </div>`
          : `<div class="inline-edit">
              <span>${teamNameEsc}</span>
              <button onclick="startEditTeam(${team.id})">✏️ Edit</button>
            </div>`;

        const playerCells = team.players.length
          ? team.players.map((playerName, index) => {
              const displayName = escapeHtml(playerName);
              if (editState.player && editState.player.teamId === team.id && editState.player.index === index) {
                const inputId = playerInputId(team.id, index);
                return `<div class="player-row">
                    <input id="${inputId}" value="${displayName}">
                    <button onclick="savePlayerName(${team.id}, ${index})">Save</button>
                    <button onclick="cancelPlayerEdit()">Cancel</button>
                  </div>`;
              }
              const encodedName = encodeURIComponent(playerName);
              return `<div class="player-row">
                  <span>${displayName}</span>
                  <button onclick="startEditPlayer(${team.id}, ${index})">✏️ Edit</button>
                  <button onclick="removePlayer(${team.id}, '${encodedName}')">Remove</button>
                </div>`;
            }).join("")
          : "<span>No players</span>";

        tbody.innerHTML += `<tr>
          <td>${teamCell}</td>
          <td>${playerCells}</td>
          <td>-</td>
        </tr>`;
      }
    }

    function startEditTeam(teamId) {
      editState.teamId = teamId;
      editState.player = null;
      renderTable();
    }

    function cancelTeamEdit() {
      editState.teamId = null;
      renderTable();
    }

    async function saveTeamName(teamId) {
      const team = teams.get(teamId);
      if (!team) return;

      const input = document.getElementById(`team-edit-${teamId}`);
      if (!input) return;

      const newName = input.value.trim();
      if (!newName) {
        alert("Enter team name!");
        return;
      }

      if (newName === team.name) {
        cancelTeamEdit();
        return;
      }

      try {
        const res = await fetch("/api/update-team", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            old_name: team.name,
            new_name: newName
          })
        });
        if (!res.ok) {
          const msg = await res.text();
          alert("Failed to update team: " + msg);
          return;
        }
        await loadTeamsFromDB();
      } catch (e) {
        console.error(e);
        alert("Network error while updating team");
      }
    }

    function startEditPlayer(teamId, index) {
      editState.teamId = null;
      editState.player = { teamId, index };
      renderTable();
    }

    function cancelPlayerEdit() {
      editState.player = null;
      renderTable();
    }

    async function savePlayerName(teamId, index) {
      const team = teams.get(teamId);
      if (!team) return;

      const input = document.getElementById(playerInputId(teamId, index));
      if (!input) return;

      const oldName = team.players[index];
      if (!oldName) {
        cancelPlayerEdit();
        return;
      }

      const newName = input.value.trim();
      if (!newName) {
        alert("Enter player name!");
        return;
      }

      if (newName === oldName) {
        cancelPlayerEdit();
        return;
      }

      try {
        const res = await fetch("/api/update-player", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            old_name: oldName,
            new_name: newName,
            team_id: teamId
          })
        });

        if (!res.ok) {
          const msg = await res.text();
          alert("Failed to update player: " + msg);
          return;
        }

        await loadTeamsFromDB();
      } catch (e) {
        console.error(e);
        alert("Network error while updating player");
      }
    }
  
    function goToTracker() {
      window.location.href = "index.html";
    }
  
    // Load teams on page load
    loadTeamsFromDB();
  </script>
  
</body>
</html>
