<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Stats Update</title>
  <script src="/auth.js?v=2"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #f6f8fb; color: #1f2933; display:flex; justify-content:center; }
    .wrapper { max-width: 640px; width: 100%; background:#fff; border-radius:16px; box-shadow:0 18px 48px rgba(15,23,42,0.12); padding:24px; }
    h1 { margin-top:0; }
    p { color:#475569; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:12px; }
    button { padding: 12px 20px; border:none; border-radius:999px; background:#2563eb; color:#fff; font-size:1rem; cursor:pointer; transition:background 0.2s ease; }
    button[disabled] { background:#94a3b8; cursor:not-allowed; }
    .mic.listening { background:#dc2626; }
    .status { color:#475569; font-size:0.95rem; min-width:200px; }
    .transcript { margin-top:20px; padding:16px; min-height:140px; border-radius:12px; background:#f8fafc; box-shadow: inset 0 0 0 1px #e2e8f0; white-space:pre-wrap; line-height:1.5; }
    .error { margin-top:14px; color:#dc2626; }
    .response { margin-top:10px; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Update Stats by Voice</h1>
    <div style="display:flex; align-items:center; justify-content:space-between; background:#f1f5f9; border-radius:12px; padding:10px 14px; margin-bottom:12px;">
      <div>
        <div style="font-size:0.9rem; color:#475569;">Current league</div>
        <div id="voiceLeagueName" style="font-weight:700; color:#0f172a;">Loading…</div>
      </div>
      <button type="button" onclick="switchLeague()" style="padding:8px 14px; border:none; border-radius:10px; background:#0ea5e9; color:white; font-weight:700; cursor:pointer;">Switch</button>
    </div>
    <p>Tap the microphone, describe the play, then send it to the server.</p>
    <div class="controls">
      <button id="voiceMic" type="button" class="mic">🎙️ Start Recording</button>
      <button id="voiceSend" type="button" disabled>✅ Send to Server</button>
      <button id="voiceRetry" type="button">🔄 Retry</button>
      <span id="voiceStatus" class="status">Speech recognition is ready.</span>
    </div>
    <div id="voiceTranscript" class="transcript"></div>
    <div id="voiceError" class="error"></div>
    <div id="voiceResponse" class="response"></div>
  </div>
  <script>
    const activeLeague = window.LeagueAuth?.requireLeague();
    const apiFetch = (...args) => window.LeagueAuth ? window.LeagueAuth.leagueFetch(...args) : fetch(...args);
    function setLeagueLabel() {
      const label = document.getElementById('voiceLeagueName');
      if (label && activeLeague?.name) {
        label.textContent = activeLeague.name;
      } else if (label) {
        label.textContent = 'Unknown league';
      }
    }
    function switchLeague() {
      window.LeagueAuth?.clearLeague();
      const next = encodeURIComponent(window.location.pathname);
      window.location.href = `/login.html?next=${next}`;
    }
    setLeagueLabel();

    const micBtn = document.getElementById('voiceMic');
    const sendBtn = document.getElementById('voiceSend');
    const retryBtn = document.getElementById('voiceRetry');
    const statusEl = document.getElementById('voiceStatus');
    const transcriptEl = document.getElementById('voiceTranscript');
    const errorEl = document.getElementById('voiceError');
    const responseEl = document.getElementById('voiceResponse');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const supportsSpeechRecognition = typeof SpeechRecognition === 'function';

    let recognition = supportsSpeechRecognition ? new SpeechRecognition() : null;
    let listening = false;
    let finalTranscript = '';
    let combinedTranscript = '';

    let mediaRecorder = null;
    let mediaStream = null;
    let recordedChunks = [];
    let fallbackAudioBlob = null;
    let fallbackTimer = null;
    const MAX_RECORDING_MS = 10000;

    if (sendBtn) sendBtn.disabled = true;

    if (recognition) {
      recognition.lang = 'kk-KZ';
      recognition.interimResults = true;
      recognition.continuous = false;
    } else if (statusEl) {
      statusEl.textContent = 'This device does not support speech recognition. Audio recording fallback will be used.';
    }

    function setListening(active) {
      listening = active;
      if (!micBtn || !statusEl) return;
      micBtn.textContent = active ? '🛑 Stop' : '🎙️ Start Recording';
      micBtn.classList.toggle('listening', active);
      statusEl.textContent = active ? 'Recording…' : supportsSpeechRecognition
        ? 'Speech recognition is ready.'
        : 'Audio recording fallback is ready.';
      if (sendBtn && active) sendBtn.disabled = true;
    }

    function stopMediaStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
    }

    function stopFallbackRecording() {
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      } else {
        stopMediaStream();
      }
    }

    function reset() {
      stopFallbackRecording();
      finalTranscript = '';
      combinedTranscript = '';
      fallbackAudioBlob = null;
      recordedChunks = [];
      if (transcriptEl) transcriptEl.textContent = '';
      if (sendBtn) sendBtn.disabled = true;
      if (errorEl) errorEl.textContent = '';
      if (responseEl) {
        responseEl.textContent = '';
        responseEl.style.color = '';
      }
    }

    function startFallbackRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (errorEl) errorEl.textContent = 'Microphone unavailable.';
        return;
      }
      stopFallbackRecording();
      reset();
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaStream = stream;
        recordedChunks = [];
        try {
          mediaRecorder = new MediaRecorder(stream);
        } catch (err) {
          if (errorEl) errorEl.textContent = 'Unable to start recording: ' + err.message;
          stopMediaStream();
          return;
        }
        mediaRecorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) recordedChunks.push(event.data);
        };
        mediaRecorder.onstop = () => {
          stopMediaStream();
          mediaRecorder = null;
          fallbackTimer = null;
          fallbackAudioBlob = recordedChunks.length
            ? new Blob(recordedChunks, { type: recordedChunks[0].type || 'audio/webm' })
            : null;
          setListening(false);
          if (fallbackAudioBlob) {
            if (transcriptEl) transcriptEl.textContent = 'Audio captured. Send to server when ready.';
            if (statusEl) statusEl.textContent = 'Recording ready. Review before sending.';
            if (sendBtn) sendBtn.disabled = false;
          } else {
            if (statusEl) statusEl.textContent = 'No audio captured.';
          }
        };
        mediaRecorder.start();
        setListening(true);
        if (statusEl) statusEl.textContent = 'Recording… (up to 10 seconds)';
        fallbackTimer = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        }, MAX_RECORDING_MS);
      }).catch(err => {
        stopMediaStream();
        if (errorEl) errorEl.textContent = 'Cannot access microphone: ' + err.message;
        if (statusEl) statusEl.textContent = supportsSpeechRecognition ? 'Speech recognition is ready.' : 'Audio recording fallback is ready.';
      });
    }

    if (recognition) {
      recognition.onresult = event => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (result.isFinal) {
            finalTranscript += result[0].transcript.trim() + ' ';
          } else {
            interim += result[0].transcript;
          }
        }
        combinedTranscript = (finalTranscript + interim).trim();
        if (transcriptEl) transcriptEl.textContent = combinedTranscript;
        if (sendBtn) sendBtn.disabled = combinedTranscript.length === 0;
      };
      recognition.onerror = event => {
        if (errorEl) errorEl.textContent = 'Speech recognition error: ' + event.error;
        setListening(false);
        if (statusEl) statusEl.textContent = 'Speech recognition is ready.';
      };
      recognition.onend = () => {
        setListening(false);
        if (statusEl) statusEl.textContent = combinedTranscript.length
          ? 'Transcript ready. Review before sending.'
          : 'Nothing captured.';
        if (sendBtn) sendBtn.disabled = combinedTranscript.length === 0;
      };
    }

    micBtn && micBtn.addEventListener('click', () => {
      if (errorEl) errorEl.textContent = '';
      if (responseEl) {
        responseEl.textContent = '';
        responseEl.style.color = '';
      }

      if (recognition) {
        if (!listening) {
          reset();
          try {
            recognition.start();
            setListening(true);
          } catch (err) {
            if (errorEl) errorEl.textContent = 'Cannot start recognition: ' + err.message;
            if (statusEl) statusEl.textContent = 'Speech recognition is ready.';
          }
        } else {
          recognition.stop();
        }
      } else {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          stopFallbackRecording();
        } else {
          startFallbackRecording();
        }
      }
    });

    sendBtn && sendBtn.addEventListener('click', async () => {
      if (recognition) {
        const payload = combinedTranscript.trim();
        if (!payload) {
          if (errorEl) errorEl.textContent = 'Speak first or record again before sending.';
          return;
        }
        sendBtn.disabled = true;
        if (statusEl) statusEl.textContent = 'Sending transcript…';
        try {
          const res = await apiFetch('/api/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: payload })
          });
          const data = await res.json().catch(() => ({}));
          const status = data.status || 'failed';
          const message = data.message || 'Unknown response';
          const details = [];
          if (data.player) details.push(`Player: ${data.player}`);
          if (data.team) details.push(`Team: ${data.team}`);
          if (data.action) details.push(`Action: ${data.action}`);
          if (data.count) details.push(`Count: ${data.count}`);
          const responseText = details.length ? `${message} (${details.join(', ')})` : message;
          if (responseEl) {
            responseEl.textContent = responseText;
            responseEl.style.color = status === 'success' ? '#15803d' : '#dc2626';
          }
          if (data.transcript && transcriptEl) transcriptEl.textContent = data.transcript;
          if (statusEl) statusEl.textContent = status === 'success' ? 'Successfully updated.' : 'Update failed.';
          if (status === 'success') {
            reset();
          } else {
            sendBtn.disabled = false;
          }
        } catch (err) {
          if (errorEl) errorEl.textContent = 'Failed to send transcript: ' + err;
          if (statusEl) statusEl.textContent = 'Speech recognition is ready.';
          sendBtn.disabled = false;
        }
      } else {
        if (!fallbackAudioBlob) {
          if (errorEl) errorEl.textContent = 'Record audio before sending.';
          return;
        }
        sendBtn.disabled = true;
        if (statusEl) statusEl.textContent = 'Uploading audio…';
        try {
          const formData = new FormData();
          formData.append('audio', fallbackAudioBlob, 'recording.webm');
          const res = await apiFetch('/api/voice/audio', {
            method: 'POST',
            body: formData
          });
          const data = await res.json().catch(() => ({}));
          const status = data.status || 'failed';
          const message = data.message || 'Unknown response';
          const details = [];
          if (data.player) details.push(`Player: ${data.player}`);
          if (data.team) details.push(`Team: ${data.team}`);
          if (data.action) details.push(`Action: ${data.action}`);
          if (data.count) details.push(`Count: ${data.count}`);
          const responseText = details.length ? `${message} (${details.join(', ')})` : message;
          if (responseEl) {
            responseEl.textContent = responseText;
            responseEl.style.color = status === 'success' ? '#15803d' : '#dc2626';
          }
          if (data.transcript && transcriptEl) transcriptEl.textContent = data.transcript;
          if (statusEl) statusEl.textContent = status === 'success' ? 'Successfully updated.' : 'Update failed.';
          if (status === 'success') {
            reset();
          } else {
            sendBtn.disabled = false;
          }
        } catch (err) {
          if (errorEl) errorEl.textContent = 'Audio upload failed: ' + err;
          if (statusEl) statusEl.textContent = 'Audio recording fallback is ready.';
          sendBtn.disabled = false;
        }
      }
    });

    retryBtn && retryBtn.addEventListener('click', () => {
      if (recognition && listening) {
        recognition.stop();
      }
      stopFallbackRecording();
      reset();
      if (statusEl) statusEl.textContent = supportsSpeechRecognition
        ? 'Speech recognition is ready.'
        : 'Audio recording fallback is ready.';
    });
  </script>
</body>
</html>
