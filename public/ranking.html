<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Player Rankings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(to bottom right, #e0e7ff, #c7d2fe); font-family: 'Inter', sans-serif; }
    .table-container { backdrop-filter: blur(20px); background: rgba(255,255,255,0.9); border-radius: 20px; box-shadow: 0 12px 36px rgba(0,0,0,0.1); }
    .fade-in { animation: fadein 0.7s ease; }
    .table-wrapper { width: 100%; overflow-x: auto; }
    table { width: 100%; border-spacing: 0 0.75rem; }
    th, td { padding: 0.75rem; text-align: center; word-break: break-word; }
    @media (max-width: 640px) {
      body { padding: 16px; }
      h1 { font-size: 2.25rem; }
      .table-container { padding: 1rem; }
      th, td { padding: 0.4rem 0.35rem; font-size: 0.85rem; }
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="p-10">
  <h1 class="text-5xl font-extrabold text-center mb-8 text-indigo-700 drop-shadow-lg">🏆 League Player Rankings</h1>
  <div class="table-wrapper">
    <div id="rankingTable" class="table-container p-4 sm:p-6 mx-auto max-w-6xl fade-in">
      <table class="min-w-full text-center border-separate">
        <thead class="text-gray-700 text-lg">
          <tr id="tableHeader" class="bg-indigo-100 rounded-lg">
            <th class="py-3 px-4 rounded-l-xl cursor-pointer" onclick="toggleSort()">Player ⬇</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let rankingRows = [];
    let dateColumns = [];
    let sortDescending = true;

    async function loadRanking() {
      try {
        const [playersRes, rankingRes] = await Promise.all([
          fetch('/api/players'),
          fetch('/ranking')
        ]);

        if (!playersRes.ok) throw new Error(await playersRes.text());

        const players = await playersRes.json();
        const ranking = rankingRes.ok ? await rankingRes.json() : [];

        const rankingByName = new Map(ranking.map(entry => [entry.name, entry]));
        const playerNames = new Set([
          ...players.map(p => p.name),
          ...ranking.map(entry => entry.name)
        ]);

        const dateSet = new Set();
        ranking.forEach(entry => {
          (entry.daily_stats || []).forEach(stat => {
            if (stat?.date) dateSet.add(stat.date);
          });
        });

        dateColumns = Array.from(dateSet).sort();

        rankingRows = Array.from(playerNames).map(name => {
          const entry = rankingByName.get(name);
          const statsByDate = {};
          if (entry && Array.isArray(entry.daily_stats)) {
            entry.daily_stats.forEach(stat => {
              if (!stat || !stat.date) return;
              const goals = Number(stat.goals || 0);
              const assists = Number(stat.assists || 0);
              const points = Number(stat.points || goals + assists);
              statsByDate[stat.date] = { goals, assists, points };
            });
          }
          const totalPoints = Object.values(statsByDate).reduce((sum, stat) => sum + (stat.points || 0), 0);
          return { name, statsByDate, totalPoints };
        });

        rankingRows.sort(compareEntries);
        renderRanking();
      } catch (err) {
        const body = document.getElementById('tableBody');
        body.innerHTML = `<tr><td class="py-6 text-red-600 font-semibold" colspan="1">Failed to load ranking: ${err.message || err}</td></tr>`;
      }
    }

    function compareEntries(a, b) {
      if (a.totalPoints === b.totalPoints) {
        return a.name.localeCompare(b.name);
      }
      return b.totalPoints - a.totalPoints;
    }

    function renderRanking() {
      const headerRow = document.getElementById('tableHeader');
      const dateHeaders = dateColumns.map(date => `<th class="py-3 px-4">${formatDate(date)}</th>`).join('');
      headerRow.innerHTML = `
        <th class="py-3 px-4 rounded-l-xl cursor-pointer" onclick="toggleSort()">Player ${sortDescending ? '⬇' : '⬆'}</th>
        ${dateHeaders}`;

      const tbody = document.getElementById('tableBody');
      if (dateColumns.length === 0) {
        const message = rankingRows.length
          ? 'No snapshots yet. Click reset to log the current stats.'
          : 'No players found yet.';
        const colSpan = 1 + dateColumns.length;
        tbody.innerHTML = `<tr><td class="py-6 text-gray-600" colspan="${colSpan}">${message}</td></tr>`;
        return;
      }

      const orderedRows = sortDescending
        ? [...rankingRows].sort(compareEntries)
        : [...rankingRows].sort((a, b) => -compareEntries(a, b));

      tbody.innerHTML = orderedRows.map(row => {
        const cells = dateColumns.map(date => {
          const stat = row.statsByDate[date] || { goals: 0, assists: 0, points: 0 };
          const goals = Number(stat.goals || 0);
          const assists = Number(stat.assists || 0);
          const points = Number(stat.points || goals + assists);
          return `<td class="py-3 px-4" title="Goals: ${goals}, Assists: ${assists}">${goals}+${assists}=${points}</td>`;
        }).join('');

        return `
          <tr class="bg-white hover:bg-indigo-50 transition rounded-xl shadow-sm fade-in">
            <td class="py-3 px-4 font-semibold text-indigo-700">${row.name}</td>
            ${cells}
          </tr>`;
      }).join('');
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      if (Number.isNaN(date.getTime())) return dateStr;
      return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function toggleSort() {
      sortDescending = !sortDescending;
      renderRanking();
    }

    loadRanking();
  </script>
</body>
</html>
