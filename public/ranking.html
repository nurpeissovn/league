<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Player Rankings</title>
  <script src="/auth.js?v=2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #e0e7ff, #ede9fe);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      min-height: 100vh;
    }
    .glass {
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.88);
      border-radius: 1.25rem;
      box-shadow: 0 15px 40px rgba(30, 64, 175, 0.18);
      max-width: 920px;
      width: 100%;
      overflow-x: auto;
      animation: fadeInUp 0.6s ease;
    }
    table { width: 100%; border-spacing: 0 0.7rem; }
    th, td { padding: 0.6rem; font-size: 0.92rem; }
    th { font-weight: 600; color: #4338ca; }
    h1 { font-size: 2.4rem; margin-bottom: 1.3rem; color: #3730a3; font-weight: 800; text-align: center; }
    tr { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    tr:hover { transform: translateY(-2px); }
    .rank-1 { background: rgba(147, 197, 253, 0.45); font-weight: 700; }
    .rank-2 { background: rgba(191, 219, 254, 0.4); font-weight: 700; }
    .rank-3 { background: rgba(219, 234, 254, 0.35); font-weight: 700; }
    .empty-state { padding: 2rem; text-align: center; color: #4c1d95; font-weight: 600; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 640px) {
      h1 { font-size: 1.9rem; }
      th, td { font-size: 0.78rem; padding: 0.5rem; }
    }
  </style>
</head>
<body>
  <h1>🏆 Player Rankings</h1>
  <div class="glass p-4 mb-4 w-full max-w-3xl flex items-center justify-between">
    <div>
      <div class="text-sm text-slate-500">Current league</div>
      <div id="rankingLeagueName" class="text-lg font-bold text-slate-800">Loading…</div>
    </div>
    <button type="button" onclick="switchLeague()" class="px-4 py-2 rounded-full bg-indigo-100 text-indigo-700 font-semibold hover:bg-indigo-200 transition">Switch</button>
  </div>

  <div id="rankingTable" class="glass p-6">
    <table class="text-center">
      <thead class="text-sm bg-indigo-50 rounded-xl">
        <tr id="tableHeader"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    let rankingRows = [];
    let dateColumns = [];
    let sortDescending = true;
    const activeLeague = window.LeagueAuth?.requireLeague();
    const apiFetch = (...args) => window.LeagueAuth ? window.LeagueAuth.leagueFetch(...args) : fetch(...args);

    function setLeagueLabel() {
      const label = document.getElementById('rankingLeagueName');
      if (label && activeLeague?.name) {
        label.textContent = activeLeague.name;
      } else if (label) {
        label.textContent = 'Unknown league';
      }
    }

    function switchLeague() {
      window.LeagueAuth?.clearLeague();
      const next = encodeURIComponent(window.location.pathname);
      window.location.href = `/login.html?next=${next}`;
    }

    setLeagueLabel();

    function normalizeDateStr(value) {
      if (!value) return '';
      if (value instanceof Date) {
        return value.toISOString().slice(0, 10);
      }
      const str = String(value);
      if (str.length >= 10) {
        return str.slice(0, 10);
      }
      const parsed = new Date(str);
      if (!Number.isNaN(parsed.getTime())) {
        return parsed.toISOString().slice(0, 10);
      }
      return str;
    }

    async function loadRanking() {
      try {
        const [playersRes, rankingRes, snapshotRes] = await Promise.all([
          apiFetch('/api/players'),
          apiFetch('/ranking'),
          apiFetch('/api/ranking-snapshots')
        ]);

        if (!playersRes.ok) throw new Error(await playersRes.text());

        const players = await playersRes.json();
        const ranking = rankingRes.ok ? await rankingRes.json() : [];
        let snapshots = [];
        if (snapshotRes.ok) {
          snapshots = await snapshotRes.json();
        } else {
          console.warn('Failed to load ranking snapshots:', await snapshotRes.text());
        }

        const playerByName = new Map(players.map(p => [p.name, p]));
        const aggregatedByName = new Map();
        const dateSet = new Set();

        const ensureAggregated = (name) => {
          if (!aggregatedByName.has(name)) {
            aggregatedByName.set(name, {
              statsByDate: {},
              totalPoints: 0,
              statuses: {}
            });
          }
          return aggregatedByName.get(name);
        };

        ranking.forEach(entry => {
          if (!entry?.name) return;
          const record = ensureAggregated(entry.name);
          const dailyStats = Array.isArray(entry.daily_stats) ? entry.daily_stats : [];
          let entryPoints = 0;

          if (dailyStats.length) {
            dailyStats.forEach(stat => {
              if (!stat?.date) return;
              const normDate = normalizeDateStr(stat.date);
              if (!normDate) return;
              const goals = Number(stat.goals || 0);
              const assists = Number(stat.assists || 0);
              const points = Number(stat.points || goals + assists);
              const existing = record.statsByDate[normDate];
              if (existing) {
                existing.goals += goals;
                existing.assists += assists;
                existing.points += points;
              } else {
                record.statsByDate[normDate] = { goals, assists, points };
              }
              entryPoints += points;
              dateSet.add(normDate);
            });
          } else {
            entryPoints = Number(entry.total_points || 0);
          }

          record.totalPoints += entryPoints;
        });

        if (Array.isArray(snapshots)) {
          snapshots.forEach(snap => {
            if (!snap?.player_name || !snap?.snapshot_date) return;
            const normDate = normalizeDateStr(snap.snapshot_date);
            if (!normDate) return;
            const record = ensureAggregated(snap.player_name);
            const prev = record.statuses[normDate];
            if (prev !== 'active') {
              record.statuses[normDate] = snap.status === 'active' ? 'active' : (snap.status || prev);
            }
            dateSet.add(normDate);
          });
        }

        const allNames = new Set([
          ...playerByName.keys(),
          ...aggregatedByName.keys()
        ]);

        dateColumns = Array.from(dateSet).sort();

        rankingRows = Array.from(allNames).map(name => {
          const player = playerByName.get(name);
          const aggregated = aggregatedByName.get(name) || { statsByDate: {}, totalPoints: 0, statuses: {} };
          let totalPoints = aggregated.totalPoints;
          if (totalPoints === 0 && player) {
            totalPoints = Number(player.goals || 0) + Number(player.assists || 0);
          }

          return {
            name,
            statsByDate: aggregated.statsByDate,
            totalPoints,
            statuses: aggregated.statuses
          };
        });

        rankingRows.sort(compareEntries);
        renderRanking();
      } catch (err) {
        const tbody = document.getElementById('tableBody');
        const colspan = dateColumns.length + 3;
        tbody.innerHTML = `<tr><td class="empty-state" colspan="${colspan}">Failed to load ranking: ${err.message || err}</td></tr>`;
      }
    }

    function compareEntries(a, b) {
      if (a.totalPoints === b.totalPoints) {
        return a.name.localeCompare(b.name);
      }
      return b.totalPoints - a.totalPoints;
    }

    function renderRanking() {
      const headerRow = document.getElementById('tableHeader');
      const dateHeaders = dateColumns.map(date => `<th>${formatDate(date)}</th>`).join('');
      headerRow.innerHTML = `
        <th class="cursor-pointer" onclick="toggleSort()">${sortDescending ? '▼' : '▲'} Rank</th>
        <th class="text-left">Player</th>
        ${dateHeaders}
        <th>Total</th>`;

      const tbody = document.getElementById('tableBody');
      const ordered = sortDescending
        ? [...rankingRows].sort(compareEntries)
        : [...rankingRows].sort((a, b) => compareEntries(b, a));

      if (!ordered.length) {
        const colspan = dateColumns.length + 3;
        tbody.innerHTML = `<tr><td class="empty-state" colspan="${colspan}">No player data yet. Play some matches first!</td></tr>`;
        return;
      }

      tbody.innerHTML = ordered.map((row, index) => {
        const rank = index + 1;
        const rowClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'bg-white';
        const cells = dateColumns.map(date => {
          const status = row.statuses ? row.statuses[date] : undefined;
          if (status === 'missed') {
            return `<td class="text-rose-600 font-semibold">—</td>`;
          }
          const stat = row.statsByDate[date];
          if (stat) {
            return `<td>${stat.points}</td>`;
          }
          return '<td class="text-rose-600 font-semibold">—</td>';
        }).join('');

        return `<tr class="${rowClass}">
          <td class="font-bold text-indigo-900">${rank}</td>
          <td class="font-semibold text-left text-indigo-800">${row.name}</td>
          ${cells}
          <td class="font-bold text-indigo-900">${row.totalPoints}</td>
        </tr>`;
      }).join('');
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      if (Number.isNaN(date.getTime())) return dateStr;
      return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function toggleSort() {
      sortDescending = !sortDescending;
      renderRanking();
    }

    loadRanking();
  </script>
</body>
</html>
