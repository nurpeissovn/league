<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Access</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    body { background: radial-gradient(circle at 20% 20%, #e0f2fe, #f8fafc); min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .card { max-width: 420px; width: 100%; background: #fff; border-radius: 16px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12); padding: 26px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; color: #1d4ed8; padding: 6px 12px; border-radius: 999px; font-weight: 600; }
    .error { color: #b91c1c; margin-top: 6px; font-weight: 600; }
    .league-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px dashed #e5e7eb; border-radius: 10px; margin-top: 8px; background: #f8fafc; }
    .league-name { font-weight: 700; color: #0f172a; }
    .pill { padding: 6px 10px; border-radius: 999px; background: #e2e8f0; font-size: 0.85rem; color: #475569; }
    button[type="submit"] { width: 100%; }
  </style>
  <script src="/auth.js"></script>
</head>
<body>
  <main class="card">
    <div class="badge">🔒 Password Only</div>
    <h1 style="margin-bottom: 4px;">Enter League Password</h1>
    <p style="color:#475569;">No signup needed. Share the password for each league and we will send you to its records.</p>

    <form id="loginForm">
      <label for="passwordInput">Password</label>
      <input id="passwordInput" name="password" type="password" placeholder="Enter shared password" autocomplete="current-password" required>
      <button type="submit" class="contrast">Access league</button>
      <div id="errorText" class="error" hidden>Wrong password. Try again.</div>
    </form>

    <div id="currentLeague" style="margin-top:12px; display:none;">
      <span class="pill">You are in <strong id="currentLeagueName"></strong></span>
      <button id="switchBtn" type="button" class="secondary" style="margin-top:8px; width:100%;">Switch league</button>
    </div>

    <section style="margin-top: 18px;">
      <p style="margin-bottom:8px; color:#475569;">Available leagues (change passwords in <code>public/auth.js</code>):</p>
      <div id="leagueList"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("passwordInput");
    const errorText = document.getElementById("errorText");
    const leagueList = document.getElementById("leagueList");
    const currentLeagueBox = document.getElementById("currentLeague");
    const currentLeagueName = document.getElementById("currentLeagueName");
    const switchBtn = document.getElementById("switchBtn");

    function renderLeagues() {
      leagueList.innerHTML = "";
      (window.LeagueAuth?.leagues || []).forEach((league) => {
        const row = document.createElement("div");
        row.className = "league-row";
        row.innerHTML = `
          <span class="league-name">${league.name}</span>
          <span class="pill">${league.slug}</span>
        `;
        leagueList.appendChild(row);
      });
    }

    function showActiveLeague() {
      const league = window.LeagueAuth?.getLeague?.();
      if (!league) {
        currentLeagueBox.style.display = "none";
        return;
      }
      currentLeagueName.textContent = league.name;
      currentLeagueBox.style.display = "block";
    }

    function redirectNext() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || window.LeagueAuth?.DEFAULT_REDIRECT || "/";
      window.location.replace(next);
    }

    form?.addEventListener("submit", (e) => {
      e.preventDefault();
      errorText.hidden = true;
      const password = passwordInput.value;
      const league = window.LeagueAuth?.matchPassword(password);
      if (!league) {
        errorText.hidden = false;
        return;
      }
      window.LeagueAuth?.saveLeague({
        slug: league.slug,
        name: league.name
      });
      redirectNext();
    });

    switchBtn?.addEventListener("click", () => {
      window.LeagueAuth?.clearLeague();
      passwordInput.value = "";
      showActiveLeague();
      passwordInput.focus();
    });

    renderLeagues();
    showActiveLeague();
  </script>
</body>
</html>
