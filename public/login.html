<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Access</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #c7d2fe, #e0f2fe 35%, #f8fafc 70%);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      padding: 20px;
      color: #0f172a;
    }
    .shell {
      width: min(420px, 100%);
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(15,23,42,0.18);
      border: 1px solid rgba(99,102,241,0.15);
      backdrop-filter: blur(8px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
    }
    p.subtle { margin: 0 0 18px; color: #475569; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b; }
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      transition: border 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 12px 30px rgba(79,70,229,0.3);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 16px 36px rgba(79,70,229,0.4); }
    button:active { transform: translateY(0); }
    .error { margin-top: 10px; color: #b91c1c; font-weight: 700; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef2ff;
      color: #3730a3;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
  <script src="/auth.js?v=2"></script>
</head>
<body>
  <main class="shell">
    <div class="pill">🔒 Password Access</div>
    <h1>Enter your league password</h1>
    <p class="subtle">No signup. Share the secret with your team and jump straight into your league.</p>

    <form id="loginForm">
      <label for="passwordInput">Password</label>
      <input id="passwordInput" name="password" type="password" placeholder="Enter shared password" autocomplete="current-password" required>
      <button type="submit">Unlock</button>
      <div id="errorText" class="error" hidden>Wrong password. Try again.</div>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("passwordInput");
    const errorText = document.getElementById("errorText");

    function redirectNext() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || window.LeagueAuth?.DEFAULT_REDIRECT || "/";
      window.location.replace(next);
    }

    form?.addEventListener("submit", (e) => {
      e.preventDefault();
      errorText.hidden = true;
      const password = passwordInput.value;
      const league = window.LeagueAuth?.matchPassword(password);
      if (!league) {
        errorText.hidden = false;
        return;
      }
      window.LeagueAuth?.saveLeague({
        slug: league.slug,
        name: league.name
      });
      redirectNext();
    });
    passwordInput?.focus();
  </script>
</body>
</html>
